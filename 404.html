<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · 页面走丢了 | Sprout Launcher</title>
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./assets/css/style.css" />
<style>
  .nf {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
  }
  .nf-logo { width: 68px; height: 68px; margin-bottom: 26px; animation: nfFloat 5s ease-in-out infinite; }
  @keyframes nfFloat { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  .nf-code {
    font-size: clamp(4rem, 14vw, 8rem);
    font-weight: 800; letter-spacing: -.05em; line-height: 1;
    background: var(--title-grad); background-size: 400% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf h1 { font-size: 1.2rem; margin-top: 12px; }
  .nf p { color: var(--text-dim); margin-top: 10px; max-width: 420px; }
  .nf-actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div class="bg-layer" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="grid-mask"></div>
</div>

<div class="nf">
  <img class="nf-logo" src="./assets/img/logo.svg" alt="" width="68" height="68" />
  <div class="nf-code">404</div>
  <h1>这里还没有长出东西</h1>
  <p>你访问的页面不存在，可能是链接改过，也可能是它还在发芽的路上。</p>
  <div class="nf-actions">
    <a class="btn btn-primary" href="./index.html">回到首页</a>
    <a class="btn btn-ghost" href="./index.html#download">去下载</a>
  </div>
</div>
</body>
</html>
